     "validateCaptcha", "not a robot". -->

  <form action="/errors/validateCaptcha" method="get">
    <img src="https://images-na.ssl-images-amazon.com/captcha/xzbc1234.jpg" alt="captcha image">
    <input type="text" name="field-keywords" placeholder="Type the characters you see in this image">
    <input type="submit" value="Continue shopping">
  </form>
  <p><a href="/gp/help/customer/display.html">Try a different image</a></p>

</div>
